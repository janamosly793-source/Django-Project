<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
        }
        h1 { margin-top: 0; }
        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            width: 100px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #ffb703;
            color: #1e3c72;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #ffd166; }
        .message { font-size: 18px; margin: 20px 0; min-height: 24px; }
        .history { list-style: none; padding: 0; }
        .history li { display: inline-block; margin: 3px; }
        a { color: #ffd166; }
        .won { color: #7CFC00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Guess the Number</h1>
        <p>I'm thinking of a number between 1 and 100.</p>

        <div class="message {% if won %}won{% endif %}">{{ message }}</div>

        {% if won %}
            <a href="{% url 'reset' %}">Play again</a>
        {% else %}
            <form method="post">
                {% csrf_token %}
                <input type="number" name="guess" min="1" max="100" required
                       placeholder="1-100" autofocus>
                <button type="submit">Guess</button>
            </form>
            <p>Attempts: {{ attempts }}</p>
        {% endif %}

        {% if history %}
            <p>Your guesses:</p>
            <ul class="history">
                {% for g in history %}
                    <li>{{ g }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
</body>
</html>
